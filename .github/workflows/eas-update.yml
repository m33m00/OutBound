# Publishes the app to EAS Update on every push to main and the design
# branch, so the latest version opens in Expo Go on a phone without a Mac
# running `npx expo start`. Free tier; needs the EXPO_TOKEN repository secret
# (Settings > Secrets and variables > Actions). Without it the job skips.
#
# Live data (radar, airport delays, weather, flight status) turns on when the
# SUPABASE_URL and SUPABASE_ANON_KEY repository secrets are set (John, 2026-11-01).
# Both are the project's public values, the same ones the app ships with; without
# them the update falls back to sample data.
name: Publish to Expo Go

on:
  push:
    branches: [main, claude/project-thread-fzqwou]
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN isn't set yet, so nothing was published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci

      # Creates the "outbound" project on the token's Expo account the first
      # time, then links to it; points expo-updates at it for this run only.
      - name: Link the Expo project
        if: steps.token.outputs.ok == 'true'
        run: |
          eas init --non-interactive --force
          ID=$(jq -r '.expo.extra.eas.projectId // empty' app.json)
          if [ -z "$ID" ]; then echo "::error::eas init didn't set a project ID."; exit 1; fi
          jq --arg url "https://u.expo.dev/$ID" '.expo.updates.url = $url' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Publish the update
        if: steps.token.outputs.ok == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Real airline logos (round 133). Without this secret the app shows its own tail marks.
          LOGO_DEV_KEY: ${{ secrets.LOGO_DEV_KEY }}
        run: |
          # Only a publishable key (pk_) goes into the app; a secret key (sk_) never does.
          case "$LOGO_DEV_KEY" in
            pk_*) export EXPO_PUBLIC_LOGO_DEV_KEY="$LOGO_DEV_KEY" ;;
            "") ;;
            *) echo "::warning::LOGO_DEV_KEY isn't a publishable key (pk_...), so logos stay off." ;;
          esac
          MESSAGE=$(printf '%s' "${COMMIT_MESSAGE:-Manual publish}" | head -n 1)
          eas update --branch "$BRANCH" --message "$MESSAGE" --environment preview --non-interactive
          {
            echo "### Published to Expo Go"
            echo "Open Expo Go, sign in, then Projects > outbound > branch \`$BRANCH\` and tap the newest update."
          } >> "$GITHUB_STEP_SUMMARY"

      # Says in the run summary whether each airline's real logo loads with the Logo.dev key
      # (round 133), without printing the key. Never fails the run.
      - name: Check the airline logos
        if: steps.token.outputs.ok == 'true'
        env:
          LOGO_DEV_KEY: ${{ secrets.LOGO_DEV_KEY }}
        run: |
          case "$LOGO_DEV_KEY" in
            pk_*) ;;
            "") echo "Airline logos are off: LOGO_DEV_KEY isn't set." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            *) echo "Airline logos are off: LOGO_DEV_KEY isn't a publishable key (pk_...)." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac
          echo "### Airline logos" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p logo-check
          for domain in aa.com aircanada.com alaskaair.com jetblue.com delta.com flyfrontier.com spirit.com united.com southwest.com; do
            # Light and dark (round 134: the logos sit straight on the card, so the dark ones must read on navy).
            for theme in light dark; do
              extra=""; [ "$theme" = dark ] && extra="&theme=dark"
              out=$(curl -s -o "logo-check/$domain-$theme.png" -w '%{http_code} %{content_type} %{size_download}' --max-time 30 \
                "https://img.logo.dev/$domain?token=$LOGO_DEV_KEY&size=56&format=png&retina=true&fallback=404$extra" || true)
              echo "- $domain ($theme): $out" >> "$GITHUB_STEP_SUMMARY"
              echo "logo $domain $theme: $out"
            done
          done

      # The logo pictures from the check, so their look on light and dark can be reviewed.
      - name: Keep the logo pictures
        if: steps.token.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logo-check
          path: logo-check/
          if-no-files-found: ignore
          retention-days: 7

      # Says in the run summary whether each live function answers, so a "couldn't load" in the
      # app can be traced to a function that isn't deployed or set up yet. Never fails the run.
      - name: Check the live functions
        if: steps.token.outputs.ok == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Live data is off: SUPABASE_URL and SUPABASE_ANON_KEY aren't set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE="${SUPABASE_URL%/}/functions/v1"
          echo "### Live functions" >> "$GITHUB_STEP_SUMMARY"
          for path in "live-radar?regions=conus" "live-faa-status?airports=DFW" "live-weather?stations=DFW" "live-drive-time?from=32.85,-96.85&to=32.8998,-97.0403"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$BASE/$path" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true)
            note=$(head -c 160 /tmp/body | tr -d '\n`' || true)
            echo "- ${path%%\?*}: HTTP $code ${note:+(\`$note\`)}" >> "$GITHUB_STEP_SUMMARY"
            echo "${path%%\?*}: HTTP $code $note"
          done
